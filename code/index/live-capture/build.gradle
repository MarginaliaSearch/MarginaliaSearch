plugins {
    id 'java'

    id 'application'
    id 'com.gradleup.shadow'
    id 'jvm-test-suite'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(rootProject.ext.jvmVersion))
    }
}

apply from: "$rootProject.projectDir/srcsets.gradle"

dependencies {
    compileOnly libs.jsr305
    implementation project(':code:index:live-capture:api')

    implementation project(':code:common:config')
    implementation project(':code:common:service')
    implementation project(':code:common:model')
    implementation project(':code:common:db')
    implementation project(':code:libraries:blocking-thread-pool')
    implementation project(':code:libraries:message-queue')
    implementation project(':code:libraries:domain-lock')

    implementation project(':code:execution:api')
    implementation project(':code:processes:crawling-process:ft-content-type')
    implementation project(':third-party:rssreader')

    implementation libs.jsoup
    implementation libs.opencsv
    implementation libs.slop
    implementation libs.zstd
    implementation libs.sqlite
    implementation libs.bundles.slf4j
    implementation libs.commons.lang3
    implementation libs.commons.io
    implementation libs.httpclient
    implementation libs.wiremock

    implementation libs.prometheus
    implementation libs.guava
    libs.bundles.grpc.get().each {
        implementation dependencies.create(it) {
            exclude group: 'com.google.guava'
        }
    }


    implementation libs.notnull
    implementation libs.guava
    implementation dependencies.create(libs.guice.get()) {
        exclude group: 'com.google.guava'
    }
    implementation dependencies.create(libs.spark.get()) {
        exclude group: 'org.eclipse.jetty'
    }
    implementation libs.bundles.jetty
    implementation libs.bundles.gson
    implementation libs.bundles.mariadb

    testImplementation libs.bundles.slf4j.test
    testImplementation libs.bundles.junit
    testImplementation libs.mockito

    testImplementation platform(libs.testcontainers.bom.get()) {
        exclude group: 'org.apache.commons'
    }
    testImplementation libs.commons.compress
    testImplementation libs.commons.codec
    testImplementation libs.bundles.testcontainers
    testImplementation project(':code:libraries:test-helpers')

}

