ext {
    joobyVersion = '4.5.4'
}

dependencyResolutionManagement {

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://repo1.maven.org/maven2/" }
        maven { url "https://www2.ph.ed.ac.uk/maven2/" }
        maven { url "https://jitpack.io/" }
        maven { url "https://artifacts.marginalia.nu/snapshots" }
      //  maven { url "https://artifactory.cronapp.io/public-release/" }

        exclusiveContent {
            forRepository {
                maven {
                    url = uri("https://jitpack.io")
                }
            }
            filter {
                // Only use JitPack for the `gson-record-type-adapter-factory` library
                includeModule("com.github.Marcono1234", "gson-record-type-adapter-factory")
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    url = uri("https://artifacts.marginalia.nu/snapshots")
                }
            }
            filter {
                // Only use the Marginalia snapshot repository for the `slop` library
                includeModule("nu.marginalia", "slop")
            }
        }
    }

    versionCatalogs {
        libs {
            library('mariadb-client', 'org.mariadb.jdbc', 'mariadb-java-client').version('3.5.10')
            library('hikaricp', 'com.zaxxer:HikariCP:7.1.0')

            library('spark', 'com.sparkjava', 'spark-core').version('2.9.4')
            library('guice', 'com.google.inject', 'guice').version('7.0.0')
            library('guava', 'com.google.guava', 'guava').version('33.7.1-jre')
            library('protobuf', 'com.google.protobuf', 'protobuf-java').version('4.36.1')
            library('grpc-protobuf', 'io.grpc', 'grpc-protobuf').version('1.84.0')
            library('grpc-stub', 'io.grpc', 'grpc-stub').version('1.84.0')
            library('grpc-inprocess', 'io.grpc', 'grpc-inprocess').version('1.84.0')
            library('grpc-netty', 'io.grpc', 'grpc-netty').version('1.84.0')

            library('prometheus', 'io.prometheus', 'prometheus-metrics-core').version('1.8.0')
            library('prometheus-server', 'io.prometheus', 'prometheus-metrics-exporter-httpserver').version('1.8.0')
            library('prometheus-client', 'io.prometheus', 'client_java_parent').version('1.8.0')
            library('prometheus-jvm', 'io.prometheus', 'prometheus-metrics-instrumentation-jvm').version('1.8.0')

            library('slf4j.api', 'org.slf4j', 'slf4j-api').version('2.0.19')
            library('slf4j.jdk14', 'org.slf4j', 'slf4j-jdk14').version('2.0.19')

